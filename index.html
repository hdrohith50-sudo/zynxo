<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zynxo</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}.input{width:90%;padding:12px;margin:10px 5%;border-radius:8px;border:1px solid #333;background:#111;color:#fff}.btn{width:90%;padding:14px;margin:10px 5%;border-radius:10px;border:none;background:#00ff88;color:#000;font-weight:bold}.card{background:#111;border:1px solid #222;margin:10px 0;border-radius:12px;padding:15px}.bal{font-size:28px;color:#00ff88;text-align:center;margin:15px}.txn{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between;font-size:13px}.tab{display:flex;gap:10px}.tab button{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff}.tab button.active{background:#00ff88;color:#000}</style></head><body><div class="bal">Balance: ₹<span id="balAmt">5</span></div><div class="tab"><button class="active" onclick="showTab('deposit')" id="tDep">DEPOSIT</button><button onclick="showTab('withdraw')" id="tWith">WITHDRAW</button><button onclick="showTab('history')" id="tHist">HISTORY</button></div><div class="card" id="depositSec"><h3>💰 DEPOSIT - No Tax (101-50000)</h3><input id="depAmt" class="input" type="number" placeholder="Min 101 Max 50000" oninput="calcDeposit()"><p id="depInfo" style="font-size:12px;color:#00ff88;margin:8px;padding:8px;background:#0a2a0a;border-radius:8px;border:1px dashed #00ff88">Min 101 Max 50000 | No Tax</p><button class="btn" onclick="doDeposit()">DEPOSIT NOW</button></div><div class="card" id="withdrawSec" style="display:none"><h3>💸 WITHDRAW - 10AM to 10PM</h3><input id="withAmt" class="input" type="number" placeholder="Min 101 Max 5001" oninput="calcTax()"><p id="taxInfo" style="font-size:12px;color:#00ff88;margin:8px;padding:8px;background:#0a2a0a;border-radius:8px;border:1px dashed #00ff88">Loading...</p><input id="upiId" class="input" placeholder="UPI ID Ex: 98765@ybl"><button class="btn" onclick="doWithdraw()">WITHDRAW NOW</button><p style="font-size:10px;opacity:0.6;text-align:center">⏰10AM-10PM | Daily 15000 | Min 101 Max 5001 | Tax 5%+5</p></div><div class="card" id="historySec" style="display:none"><h3>📜 TRANSACTION HISTORY</h3><div id="txnList">No transactions yet</div><button class="btn" style="background:#333;color:#fff" onclick="clearHistory()">Clear History</button></div><script>
let u=JSON.parse(localStorage.getItem('zynxo_user')||'{"rs":5}');document.getElementById('balAmt').innerText=u.rs;function updateBal(user){document.getElementById('balAmt').innerText=user.rs;u=user}
function showTab(t){document.getElementById('depositSec').style.display=t=='deposit'?'block':'none';document.getElementById('withdrawSec').style.display=t=='withdraw'?'block':'none';document.getElementById('historySec').style.display=t=='history'?'block':'none';document.getElementById('tDep').classList.toggle('active',t=='deposit');document.getElementById('tWith').classList.toggle('active',t=='withdraw');document.getElementById('tHist').classList.toggle('active',t=='history');if(t=='history')loadHistory()}
function saveTxn(type,amount,tax,finalAmt,upi,status){let txns=JSON.parse(localStorage.getItem('zynxo_txns')||'[]');let id='TXN'+Date.now();let now=new Date();txns.unshift({id:id,type:type,amount:amount,tax:tax,finalAmt:finalAmt,upi:upi||'',status:status,date:now.toLocaleString()});localStorage.setItem('zynxo_txns',JSON.stringify(txns))}
function loadHistory(){let txns=JSON.parse(localStorage.getItem('zynxo_txns')||'[]');let list=document.getElementById('txnList');if(txns.length==0){list.innerHTML='<p style="text-align:center;opacity:0.5;padding:20px">No transactions yet<br>Deposit/Withdraw madi</p>';return}let html='';txns.forEach(t=>{let color=t.type=='DEPOSIT'?'#00ff88':'#ff4444';let icon=t.type=='DEPOSIT'?'💰':'💸';html+=`<div class="txn"><div><b style="color:${color}">${icon} ${t.type}</b><br><small>${t.date}</small><br><small>${t.id}</small></div><div style="text-align:right"><b>₹${t.amount}</b><br>${t.type=='WITHDRAW'?`<small>Tax ₹${t.tax.toFixed(2)}</small><br>`:''}<small>${t.status}</small></div></div>`});list.innerHTML=html}
function clearHistory(){if(confirm('Clear history?')){localStorage.removeItem('zynxo_txns');loadHistory()}}
function doDeposit(){let amt=parseInt(document.getElementById('depAmt').value);if(!amt||amt<101){alert('Min Deposit ₹101');return}if(amt>50000){alert('Max Deposit ₹50000');return}let user=JSON.parse(localStorage.getItem('zynxo_user')||'{"rs":5}');user.rs+=amt;localStorage.setItem('zynxo_user',JSON.stringify(user));updateBal(user);saveTxn('DEPOSIT',amt,0,amt,'','SUCCESS');alert(`✅ Deposit Success ₹${amt} No Tax! New Balance ₹${user.rs}`);document.getElementById('depAmt').value='';calcDeposit()}
function calcDeposit(){let amt=parseInt(document.getElementById('depAmt').value)||0;let info=document.getElementById('depInfo');if(amt>=101&&amt<=50000){info.innerHTML=`✅ You Get ₹${amt} (No Tax)`}else{info.innerHTML=`Min ₹101 Max ₹50000 | No Tax | 24 Hours`}}
function doWithdraw(){let amt=parseInt(document.getElementById('withAmt').value);let upi=document.getElementById('upiId').value.trim();let now=new Date();let h=now.getHours();if(h<10||h>=22){alert(`❌ Withdraw Closed! Time 10AM-10PM Only. Now ${now.toLocaleTimeString()}`);return}if(!amt||amt<101){alert('Min Withdraw ₹101');return}if(amt>5001){alert('Max Per Transaction ₹5001! Daily ₹15000');return}if(!upi.includes('@')){alert('Correct UPI ID haki Ex: 98765@ybl');return}let today=new Date().toDateString();let wd=JSON.parse(localStorage.getItem('zynxo_withdraw_daily')||'{"date":"","total":0}');if(wd.date!==today)wd={date:today,total:0};let remain=15000-wd.total;if(amt>remain){alert(`❌ Daily Limit Over! Daily Max ₹15000 Today Used ₹${wd.total} Remain ₹${remain}`);return}let user=JSON.parse(localStorage.getItem('zynxo_user')||'{"rs":5}');if(amt>user.rs){alert(`Balance kammide! Balance ₹${user.rs}`);return}let tax=amt*0.05+5;let finalAmt=amt-tax;if(!confirm(`Amount ₹${amt} Tax ₹${tax.toFixed(2)} You Get ₹${finalAmt.toFixed(2)} UPI ${upi} Confirm?`))return;wd.total+=amt;wd.date=today;localStorage.setItem('zynxo_withdraw_daily',JSON.stringify(wd));user.rs-=amt;localStorage.setItem('zynxo_user',JSON.stringify(user));updateBal(user);saveTxn('WITHDRAW',amt,tax,finalAmt,upi,'PENDING');alert(`✅ Withdraw Requested! ₹${amt} Daily ${wd.total}/15000`);document.getElementById('withAmt').value='';calcTax()}
function calcTax(){let amt=parseInt(document.getElementById('withAmt').value)||0;let today=new Date().toDateString();let wd=JSON.parse(localStorage.getItem('zynxo_withdraw_daily')||'{"date":"","total":0}');if(wd.date!==today)wd.total=0;let remain=15000-wd.total;let open=new Date().getHours()>=10&&new Date().getHours()<22;let status=open?"🟢 OPEN":"🔴 CLOSED";let info=document.getElementById('taxInfo');if(amt>=101&&amt<=5001){let tax=amt*0.05+5;let finalAmt=amt-tax;info.innerHTML=`Tax ₹${tax.toFixed(2)} | Get ₹${finalAmt.toFixed(2)}<br><small>${status} 10AM-10PM | Daily ${wd.total}/15000 | Remain ${remain}</small>`}else{info.innerHTML=`Min ₹101 Max ₹5001 | ${status} 10AM-10PM | Daily ${wd.total}/15000`}}
calcDeposit();calcTax();
</script></body></html>
